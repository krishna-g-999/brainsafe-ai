# Tests and a smoke reproduction on every push.
#
# Two jobs, because they answer different questions and have very different costs.
#
#   test    the scientific core, on a clean machine, with no models present. Fast, runs everywhere,
#           and is the gate. The integration suite skips itself when models_rf/ is absent, which is
#           the normal state of a fresh clone, and a skip is visible in the log.
#   smoke   proves a fresh clone can regenerate something from the committed artefacts. It does not
#           retrain: training is hours and would make CI useless as a gate.
#
# The container is built but not run against real models, because the image fetches 0.84 GB at build
# time from a published archive and that archive has no URL yet. The build is still worth doing: it
# catches a broken Dockerfile, which is otherwise found at deploy time.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is what the container runs; Windows is what the work is developed on. Both, because
        # a path-separator bug that only appears on one of them is a real class of defect here.
        os: [ubuntu-latest, windows-latest]
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov

      - name: Record the environment being tested
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.platform())"
          python -m pip freeze

      - name: Unit tests with coverage on the scientific core
        run: >
          python -m pytest tests/ -v
          --cov=src/brainsafe/features --cov=src/brainsafe/models
          --cov-report=term-missing --cov-report=xml
        shell: bash

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  smoke:
    name: smoke reproduction
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Provenance map regenerates
        run: python tools/build_provenance.py

      - name: Freshness check runs and reports
        # Expected to report the artefacts a clone does not carry. The point is that it runs and
        # says so, rather than passing silently; `|| true` keeps a truthful report from failing CI.
        run: python tools/check_freshness.py || true

      - name: Manuscript rebuilds and every citation resolves
        # Fails if any [@key] cannot be resolved, which is the check that keeps the bibliography
        # honest. It needs no models.
        run: python src/brainsafe/analysis/build_manuscript.py

      - name: Upload the rebuilt manuscript
        uses: actions/upload-artifact@v4
        with:
          name: manuscript
          path: |
            manuscript/NAR_WebServer_BrainSafe_built.md
            repro/PROVENANCE.md
          if-no-files-found: error

  container:
    name: container builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        # No push and no model fetch: BRAINSAFE_SKIP_MODEL_FETCH is set inside the image, and the
        # build-time fetch needs a published archive URL that does not exist yet. Building proves
        # the Dockerfile and the dependency set are sound.
        run: docker build --build-arg SKIP_MODEL_FETCH=1 -t brainsafe-ai:ci .
        continue-on-error: true

      - name: Report image size
        run: docker images brainsafe-ai:ci || true
