[pytest]
# Without this, a bare `pytest` at the repository root walks into
# _ARCHIVE_2026-08-10_Brainsafe/ and fails at collection on retired scripts that import modules no
# longer present. The Makefile and CI both say `pytest tests/`, so the failure only ever hits
# someone running pytest the obvious way, which is the worst audience for it.
testpaths = tests
norecursedirs = _ARCHIVE_* archive brainsafe_env .git models_rf data
